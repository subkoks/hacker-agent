name: Bug report
description: Report a defect or unexpected behavior in hacker-agent
title: "bug: <short description>"
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. Please fill in the sections below so we can reproduce it quickly.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One sentence describing the problem.
      placeholder: "memory import crashes on empty categories list"
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Exact commands or code that trigger the bug.
      placeholder: |
        1. `python -m hacker_agent memory import /tmp/dump.json`
        2. ...
      render: bash
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the full stack trace if one was raised.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: hacker-agent version
      placeholder: "0.2.0"
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.13.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows (WSL)
        - Other
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Logs, screenshots, related issues, anything else useful.
