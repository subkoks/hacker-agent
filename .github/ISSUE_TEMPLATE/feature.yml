name: Feature request
description: Propose a new capability or improvement
title: "feat: <short description>"
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user-facing problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should it work? CLI surface, API signature, UX flow.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Subsystem
      options:
        - memory
        - cve
        - audit
        - stake
        - ghidra
        - cli
        - ci / tooling
        - docs
        - other
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: I am willing to send a PR for this
        - label: Breaking change (requires major version bump)
