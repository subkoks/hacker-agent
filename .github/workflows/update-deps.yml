name: Update Dependencies

on:
  schedule:
    - cron: "37 2 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install pip-tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-tools

      - name: Generate requirements.txt
        run: |
          if [[ ! -f requirements.in ]]; then
            echo "requirements.in missing; nothing to do"
            exit 0
          fi
          pip-compile --upgrade --resolver=backtracking \
            --output-file=requirements.txt \
            requirements.in

      - name: Open update PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: deps/auto-update
          base: main
          commit-message: "deps: refresh requirements.txt via pip-compile"
          title: "deps: automated dependency update"
          body: |
            Automated dependency refresh via `pip-compile`.

            - Generated from `requirements.in`
            - Please review the diff and verify CI is green before merging
          add-paths: |
            requirements.txt
          delete-branch: true
