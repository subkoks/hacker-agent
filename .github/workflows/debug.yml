name: Debug Health Check

on:
  schedule:
    - cron: "13 3 * * *"
  workflow_dispatch:

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Setup Python
        run: uv python install 3.13

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Ruff
        run: uv run ruff check src tests

      - name: Mypy
        run: uv run mypy src

      - name: Bandit
        run: uv run bandit -r src

      - name: CLI smoke
        run: |
          uv run python -m hacker_agent --version
          uv run python -m hacker_agent stats
          uv run python -m hacker_agent ghidra tools | head -20

      - name: Repo footprint
        run: |
          echo "Python files: $(find src tests -name '*.py' | wc -l)"
          echo "Shell scripts: $(find scripts -name '*.sh' | wc -l)"
          echo "Last commit: $(git log -1 --oneline)"
