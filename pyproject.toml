[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hacker-agent"
version = "0.2.1"
description = "Permanent-memory security research and reverse-engineering agent toolkit"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "subkoks", email = "subkoks@gmail.com" }]
keywords = [
    "security",
    "pentesting",
    "cve",
    "cisa-kev",
    "nvd",
    "reverse-engineering",
    "ghidra",
    "mcp",
    "cursor",
    "sqlite",
    "security-audit",
    "stake-engine",
    "audit",
    "typer",
    "python",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Disassemblers",
]
dependencies = [
    "httpx>=0.27,<1.0",
    "pydantic>=2.7,<3.0",
    "typer>=0.12,<1.0",
    "rich>=13.7,<16.0",
    "platformdirs>=4.2,<5.0",
    "python-dateutil>=2.9,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10.0",
    "pytest-cov>=5.0,<7.0",
    "pytest-asyncio>=1.0,<2.0",
    "ruff>=0.4,<1.0",
    "mypy>=1.10,<2.0",
    "bandit>=1.7,<2.0",
    "respx>=0.21,<1.0",
]

[project.urls]
Homepage = "https://github.com/subkoks/hacker-agent"
Repository = "https://github.com/subkoks/hacker-agent"
Issues = "https://github.com/subkoks/hacker-agent/issues"

[project.scripts]
hacker-agent = "hacker_agent.cli.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hacker_agent"]

[tool.hatch.build.targets.sdist]
include = ["src/hacker_agent", "tests", "README.md", "pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]
extend-exclude = ["data", "logs", "backups"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "C4",  # comprehensions
    "UP",  # pyupgrade
    "SIM", # simplify
    "TID", # tidy imports
    "PTH", # use pathlib
    "RUF", # ruff-specific
]
ignore = [
    "E501",  # line length handled by formatter
    "B008",  # function calls in default args (typer Options)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--showlocals",
]
markers = [
    "network: marks tests that need network access (deselect with '-m \"not network\"')",
    "slow: marks tests as slow",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:dateutil.*",
]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
ignore_missing_imports = true
exclude = ["data/", "logs/", "backups/", "build/", "dist/"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.bandit]
exclude_dirs = ["tests", "data", "logs", "backups"]
skips = ["B101"]  # assert_used (we use asserts in tests)
